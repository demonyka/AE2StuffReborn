buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = "${minecraft_version}-${mod_version}"
group = 'net.bdew.ae2stuff'
archivesBaseName = 'AE2StuffReforged'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mcp_channel, version: mcp_mappings

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // AE2 ships mixins whose refmap has to be remapped for the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                ae2stuff {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args "--nogui"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'modmaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'cursemaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}:api")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}")

    implementation fg.deobf("curse.maven:hwyla-253449:${hwyla_file}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'version': mod_version
    }
}

jar {
    from('LICENSE.txt')
    manifest {
        attributes([
            'Specification-Title'     : 'ae2stuff',
            'Implementation-Vendor'   : 'demonyga',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
