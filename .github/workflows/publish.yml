name: publish

# Builds the mod and uploads it to Modrinth and CurseForge when a GitHub release is published.
# Needs repository variables MODRINTH_ID and CURSEFORGE_ID, and secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
# A platform without its token is skipped.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Read version and changelog
        id: meta
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-changelog.md
          test -s release-changelog.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/AE2StuffReforged-*.jar
          name: AE2 Stuff Reforged ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.minecraft }}
          version-type: release
          changelog-file: release-changelog.md
          loaders: forge
          game-versions: ${{ steps.meta.outputs.minecraft }}
          java: 8
          dependencies: |
            appliedenergistics2(required){modrinth:ae2}{curseforge:applied-energistics-2}
            jei(optional){modrinth:jei}{curseforge:jei}
            waila(optional){modrinth:hwyla}{curseforge:hwyla}
            jade(optional){modrinth:jade}{curseforge:jade}
